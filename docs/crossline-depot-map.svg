<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="title desc">
  <title id="title">BREACHLINE - Crossline Depot tactical map</title>
  <desc id="desc">Symmetrical three-lane map with blue spawn on the left, red spawn on the right, and an open Pressure Zone in the center.</desc>
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M 80 0 L 0 0 0 80" fill="none" stroke="#31404a" stroke-width="2" opacity=".42"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      .label{font-family:Arial,sans-serif;fill:#eef5ee;font-weight:700;letter-spacing:3px;text-anchor:middle}.small{font-size:20px;fill:#9fb2b8;letter-spacing:2px}.lane{font-size:24px;fill:#a8bac1;letter-spacing:4px}.wall{fill:#36444c;stroke:#9caeb5;stroke-width:5}.cover{fill:#896b43;stroke:#d6b06d;stroke-width:5}.spawnBlue{fill:#1787d2;stroke:#83d7ff;stroke-width:5}.spawnRed{fill:#c53f3a;stroke:#ff9890;stroke-width:5}.pickup{fill:#e7b84d;stroke:#fff0a7;stroke-width:4}.med{fill:#cf5149;stroke:#ffd2ca;stroke-width:4}.route{fill:none;stroke:#89cce6;stroke-width:10;stroke-dasharray:22 20;opacity:.62}.routeRed{fill:none;stroke:#ef8b81;stroke-width:10;stroke-dasharray:22 20;opacity:.62}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#12191d"/>
  <rect x="42" y="42" width="1516" height="876" rx="8" fill="#253139"/>
  <rect x="42" y="42" width="1516" height="876" rx="8" fill="url(#grid)"/>

  <!-- Primary player routes: three lanes plus two pre-objective crossovers. -->
  <path class="route" d="M165 250 H520 H800 M165 480 H525 H800 M165 710 H520 H800"/>
  <path class="routeRed" d="M1435 250 H1080 H800 M1435 480 H1075 H800 M1435 710 H1080 H800"/>

  <!-- Perimeter and objective shell. -->
  <g filter="url(#shadow)">
    <rect class="wall" x="0" y="0" width="1600" height="42"/><rect class="wall" x="0" y="918" width="1600" height="42"/>
    <rect class="wall" x="0" y="0" width="42" height="960"/><rect class="wall" x="1558" y="0" width="42" height="960"/>
    <rect class="wall" x="420" y="170" width="235" height="36"/><rect class="wall" x="945" y="170" width="235" height="36"/>
    <rect class="wall" x="420" y="754" width="235" height="36"/><rect class="wall" x="945" y="754" width="235" height="36"/>
    <rect class="wall" x="455" y="374" width="36" height="212"/><rect class="wall" x="1109" y="374" width="36" height="212"/>
    <rect class="wall" x="660" y="322" width="280" height="36"/><rect class="wall" x="660" y="602" width="280" height="36"/>
  </g>

  <!-- Intentional cover: spawn anchors then lane anchors. -->
  <g filter="url(#shadow)">
    <rect class="cover" x="245" y="175" width="150" height="64" rx="8"/><rect class="cover" x="1205" y="175" width="150" height="64" rx="8"/>
    <rect class="cover" x="245" y="721" width="150" height="64" rx="8"/><rect class="cover" x="1205" y="721" width="150" height="64" rx="8"/>
    <rect class="cover" x="525" y="245" width="180" height="72" rx="8"/><rect class="cover" x="895" y="245" width="180" height="72" rx="8"/>
    <rect class="cover" x="525" y="643" width="180" height="72" rx="8"/><rect class="cover" x="895" y="643" width="180" height="72" rx="8"/>
  </g>

  <!-- Objective. -->
  <circle cx="800" cy="480" r="92" fill="#dcb755" opacity=".17" stroke="#f5cf68" stroke-width="8" stroke-dasharray="18 11"/>
  <text class="label" x="800" y="474" font-size="27">PRESSURE</text><text class="label" x="800" y="507" font-size="27">ZONE</text>

  <!-- Pickups are deliberately contestable. -->
  <g><circle class="pickup" cx="800" cy="255" r="20"/><text class="label" x="800" y="263" font-size="18">A</text>
    <circle class="pickup" cx="800" cy="705" r="20"/><text class="label" x="800" y="713" font-size="18">A</text>
    <rect class="med" x="537" y="462" width="36" height="36" rx="7"/><path d="M555 469v22m-11-11h22" stroke="#fff" stroke-width="6"/>
    <rect class="med" x="1027" y="462" width="36" height="36" rx="7"/><path d="M1045 469v22m-11-11h22" stroke="#fff" stroke-width="6"/></g>

  <!-- Symmetrical three-person spawn formations. -->
  <g><circle class="spawnBlue" cx="165" cy="250" r="26"/><circle class="spawnBlue" cx="165" cy="480" r="26"/><circle class="spawnBlue" cx="165" cy="710" r="26"/>
    <circle class="spawnRed" cx="1435" cy="250" r="26"/><circle class="spawnRed" cx="1435" cy="480" r="26"/><circle class="spawnRed" cx="1435" cy="710" r="26"/></g>

  <text class="label" x="165" y="110" font-size="30" fill="#83d7ff">BLUE SPAWN</text><text class="label" x="1435" y="110" font-size="30" fill="#ff9890">RED SPAWN</text>
  <text class="label lane" x="800" y="100">UPPER LANE</text><text class="label lane" x="800" y="875">LOWER LANE</text>
  <text class="label small" x="530" y="350">CROSSOVER</text><text class="label small" x="1070" y="350">CROSSOVER</text>
  <text class="label small" x="800" y="930">CROSSLINE DEPOT · GRAYBOX V2</text>
</svg>
